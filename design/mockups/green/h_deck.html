<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>:root{--g900:#003d25;--g700:#00703c;--g500:#2e9c5e;--g300:#8fd0a8;--g100:#d7efe0;--g50:#eef8f2;--white:#fff;--ink:#0f2219;--mute:#5f7268;--neg:#c2402f;}*{box-sizing:border-box}body{margin:0;width:412px;min-height:915px;background:var(--g50);font:16px/1.45 Onest,sans-serif;color:var(--ink);position:relative;overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:center;padding:18px 22px}.top b{font-size:20px;color:var(--g900)}.dots{display:flex;gap:5px}.dots i{width:22px;height:4px;border-radius:2px;background:var(--g100)}.dots i.on{background:var(--g700)}
.deck{position:relative;height:600px;margin:6px 22px 0}
.card{position:absolute;inset:0;border-radius:32px;padding:26px}
.c3{background:var(--g300);transform:translateY(34px) scale(.88)}.c2{background:var(--g500);transform:translateY(17px) scale(.94)}
.c1{background:var(--g900);color:#fff;transform:rotate(-2.5deg);box-shadow:0 20px 40px rgba(0,61,37,.25);display:flex;flex-direction:column}
.k{font-size:14px;opacity:.7}.big{font:800 64px/1 Onest;letter-spacing:-2px;margin:26px 0 8px}.big small{font-size:28px}
.c1 h2{font:700 26px/1.2 Onest;margin:0;letter-spacing:-.4px}.c1 p{opacity:.8;margin:12px 0 0}
.mini{margin-top:auto;display:grid;grid-template-columns:repeat(15,1fr);gap:3px}.mini i{height:30px;border-radius:5px;background:rgba(255,255,255,.18)}.mini i.r{background:var(--neg)}.mini i.p{background:#fff}
.lab{display:flex;justify-content:space-between;font-size:12px;opacity:.75;margin-top:6px}
.acts{display:flex;gap:10px;margin-top:18px}.acts span{flex:1;text-align:center;padding:13px;border-radius:18px;background:#fff;color:var(--g900);font-weight:700}.acts span.g{background:rgba(255,255,255,.12);color:#fff}
.hint{text-align:center;color:var(--mute);font-size:14px;margin-top:56px}
</style></head><body>
<div class="top"><b>Today for Emma</b><div class="dots"><i class="on"></i><i></i><i></i><i></i></div></div>
<div class="deck"><div class="card c3"></div><div class="card c2"></div>
<div class="card c1"><div class="k">1 of 4 · needs you</div><div class="big">−63<small> €</small></div>
<h2>Rent is bigger than what's left</h2><p>762,79 € leaves on 3 Oct. You have 699,85 €. Payday is 15 Oct.</p>
<div class="mini"><i></i><i></i><i class="r"></i><i class="r"></i><i class="r"></i><i class="r"></i><i class="r"></i><i class="r"></i><i class="r"></i><i class="r"></i><i class="r"></i><i class="r"></i><i class="r"></i><i class="r"></i><i class="p"></i></div>
<div class="lab"><span>1 Oct</span><span>below zero from 3 Oct</span><span>15 Oct</span></div>
<div class="acts"><span>Make a plan</span><span class="g">Later</span></div></div></div>
<div class="hint">Swipe for: payday week effect · your surprise pot · your spender type</div>
</body></html>
