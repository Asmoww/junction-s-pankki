<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a5c3c">
<title>Money coach</title>
<link rel="icon" href="/static/icon.svg">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <div class="notif" id="notif" hidden></div>
  <header class="top">
    <div class="top-row">
      <div class="brand"><div class="brand-mark">S</div>Money coach</div>
      <div class="top-actions">
        <button class="lang" id="lang" aria-label="Language">EN</button>
        <button class="who" id="who" aria-label="Switch customer"><span class="avatar" id="who-initial">?</span><span id="who-name"></span></button>
      </div>
    </div>
    <div class="greet" id="greet">&nbsp;</div>
    <div class="balance" id="balance">&nbsp;</div>
  </header>

  <main id="view-home" class="view">
    <section class="card"><div class="skeleton" style="height:38px;width:60%"></div><div class="skeleton" style="width:80%"></div></section>
  </main>
  <main id="view-coach" class="view" hidden>
    <div class="section-title" id="ask-title"></div>
    <div class="chips" id="chips"></div>
    <div class="thread" id="thread" aria-live="polite"></div>
  </main>
  <main id="view-learn" class="view" hidden></main>

  <div class="composer" id="composer" hidden>
    <form id="ask">
      <input id="q" type="text" autocomplete="off" enterkeyhint="send" maxlength="500">
      <button class="send" id="send" type="submit" aria-label="Send">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
  </div>
  <nav class="tabbar" id="tabbar">
    <button data-tab="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span></span></button>
    <button data-tab="coach"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg><span></span></button>
    <button data-tab="learn"><svg viewBox="0 0 24 24"><path d="M12 4l10 5-10 5L2 9zM6 11v5c3 2.5 9 2.5 12 0v-5"/></svg><span></span></button>
  </nav>
</div>
<div id="sheet-root"></div>
<div class="toast" id="toast" hidden></div>
<script src="/static/i18n.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
