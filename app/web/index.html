<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a5c3c">
<title>Money coach</title>
<link rel="icon" href="/static/icon.svg">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-row">
      <div class="brand"><div class="brand-mark">S</div>Money coach</div>
      <button class="who" id="who" aria-label="Switch customer"><span class="avatar" id="who-initial">?</span><span id="who-name">Choose</span></button>
    </div>
    <div class="greet" id="greet">Your account</div>
    <div class="balance" id="balance">&nbsp;</div>
  </header>

  <main>
    <section class="card" id="safe">
      <div class="label">Safe to spend this week</div>
      <div class="skeleton" style="height:38px;width:60%"></div>
      <div class="skeleton" style="width:80%"></div>
    </section>

    <section class="card" id="baskets">
      <div class="label">This month in three baskets</div>
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
    </section>

    <div class="section-title">Ask about your money</div>
    <div class="chips" id="chips"></div>
    <div class="thread" id="thread" aria-live="polite"></div>
  </main>

  <div class="composer">
    <form id="ask">
      <input id="q" type="text" placeholder="Ask anything about your money" autocomplete="off" enterkeyhint="send" maxlength="500">
      <button class="send" id="send" type="submit" aria-label="Send">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
  </div>
</div>
<div id="sheet-root"></div>
<script src="/static/app.js"></script>
</body>
</html>
